name: Release Bot

on:
  pull_request:
    types: [opened, reopened, closed]
    branches: [main, stable]
  release:
    types: [released, prereleased]

jobs:
  run:
    if: startsWith(github.head_ref, 'releases/') || startsWith(github.head_ref, 'betas/') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: statsig-io/statsig-publish-sdk-action@e2d45e5d45369025b25652b3c4e8ffbee27db4e7
        if: github.event_name == 'pull_request'
        with:
          kong-private-key: ${{ secrets.KONG_GH_APP_PRIVATE_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'release'
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: github.event_name == 'release'
        with:
          node-version: '22'
      - run: npm install -g npm@11.5.1
        if: github.event_name == 'release'
      - run: npm install
        if: github.event_name == 'release'
      - name: Publish to npm
        if: github.event_name == 'release'
        env:
          IS_STABLE: ${{ contains(github.event.release.name, '[stable]') }}
        run: |
          if [[ "$IS_STABLE" == 'true' ]]; then
            npm publish --tag stable --provenance
          else
            npm publish --tag latest --provenance
          fi
